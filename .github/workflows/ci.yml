name: CI

# Feature branches validate through pull requests; main validates after merge.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: harmonic-color-graph

jobs:
  backend:
    name: backend (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: harmonic-color-graph/backend/pyproject.toml

      - name: Install backend (dev + pipeline extras)
        working-directory: harmonic-color-graph/backend
        run: pip install -e ".[dev,pipeline]"

      - name: Ruff check
        working-directory: harmonic-color-graph/backend
        run: ruff check .

      - name: Ruff format check
        working-directory: harmonic-color-graph/backend
        run: ruff format --check .

      - name: OpenAPI contract drift
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- backend/openapi.json

      - name: Unit tests
        working-directory: harmonic-color-graph/backend
        run: pytest -q --cov=app

  backend-pg:
    name: backend (postgres integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hcg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # +psycopg selects the psycopg3 driver (the project's only installed
      # Postgres driver); a bare postgresql:// URL defaults to psycopg2,
      # which isn't installed, and breaks collection for every test that
      # imports app.main (app/db/session.py creates its engine at import
      # time). psql (libpq) doesn't understand the +psycopg suffix, so it
      # gets its own plain URL below.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hcg_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hcg_test
      PSQL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hcg_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: harmonic-color-graph/backend/pyproject.toml

      - name: Install backend (dev extras)
        working-directory: harmonic-color-graph/backend
        run: pip install -e ".[dev]"

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply migrations
        run: |
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No migrations yet (expected before F05) - skipping."
          else
            for f in "${files[@]}"; do
              echo "Applying $f"
              psql "$PSQL_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
            done
          fi

      - name: Postgres integration tests
        working-directory: harmonic-color-graph/backend
        run: |
          set +e
          pytest -q -m pg
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "No pg-marked tests yet (expected before F05) - treating as pass."
            exit 0
          fi
          exit "$code"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: harmonic-color-graph/.nvmrc
          cache: "npm"
          cache-dependency-path: harmonic-color-graph/package-lock.json

      - name: Install
        run: npm ci

      - name: Generated API types drift
        run: |
          npm run gen:api
          git diff --exit-code -- lib/api/types.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  compose:
    name: local stack (Compose smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare disposable local configuration
        run: cp .env.docker.example .env.docker

      - name: Build and start full stack
        timeout-minutes: 15
        run: docker compose up --build -d

      - name: Check application and dependencies
        timeout-minutes: 6
        run: |
          curl --fail --silent --show-error --retry 60 --retry-delay 5 --retry-connrefused http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8000/health/db
          curl --fail --silent --show-error http://127.0.0.1:8000/health/redis
          curl --fail --silent --show-error --retry 60 --retry-delay 5 --retry-connrefused http://127.0.0.1:3000/
          docker compose exec -T worker python -m app.runtime_check dependencies
          worker_id=$(docker compose ps -q worker)
          for attempt in $(seq 1 60); do
            worker_health=$(docker inspect --format '{{.State.Health.Status}}' "$worker_id")
            if [ "$worker_health" = healthy ]; then break; fi
            sleep 5
          done
          test "$worker_health" = healthy

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150

      - name: Remove disposable stack and volume
        if: always()
        run: docker compose down --volumes --remove-orphans
