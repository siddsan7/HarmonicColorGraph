name: AI evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: harmonic-color-graph/backend
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HCG_LLM_FAST_INPUT_USD_PER_MTOK: '1'
      HCG_LLM_FAST_OUTPUT_USD_PER_MTOK: '5'
      HCG_LLM_INPUT_USD_PER_MTOK: '2'
      HCG_LLM_OUTPUT_USD_PER_MTOK: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: harmonic-color-graph/backend/pyproject.toml
      - name: Require Anthropic key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY repository secret is required" >&2
            exit 1
          fi
      - name: Install evaluation dependencies
        run: pip install -e '.[dev,pipeline]'
      - name: Run bounded live assistant benchmark
        run: hcg-eval ai --fixture --max-cost-usd 5 --output-dir .agent-logs/ai-eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-eval-report
          path: harmonic-color-graph/backend/.agent-logs/ai-eval/
