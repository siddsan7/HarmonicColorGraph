[project]
name = "harmonic-color-graph-backend"
version = "0.1.0"
description = "FastAPI backend for Harmonic Color Graph phase 1."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.2",
    "fastapi>=0.124.0",
    "httpx>=0.28.1",
    "music21>=9.9.1",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.7.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.45",
    "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.setuptools.packages.find]
include = ["app*"]
