[project]
name = "harmonic-color-graph-backend"
version = "0.1.0"
description = "FastAPI backend for Harmonic Color Graph."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.124.0",
    "httpx>=0.28.1",
    "numpy>=2.2.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.7.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.2,<7",
    "sqlalchemy>=2.0.45",
    "uvicorn[standard]>=0.38.0",
]

[project.scripts]
hcg-build = "pipeline.cli:main"
hcg-eval = "tests.eval.prediction:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "hypothesis>=6.168.0",
]
pipeline = [
    "polars>=1.20.0",
    "pyarrow>=18.0.0",
    "tqdm>=4.67.0",
    "psutil>=6.1.0",
]
ml = [
    "gensim>=4.3.0",
    "scikit-learn>=1.6.0",
    "scipy>=1.15.0",
    "umap-learn>=0.5.7",
]
oracle = [
    "music21>=9.9.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
markers = [
    "pg: Postgres integration test; needs TEST_DATABASE_URL (skipped otherwise)",
    "slow: throughput benchmark with a 2000-section batch",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/Path() are meant to be called in argument
# defaults; that is how the framework's dependency injection works.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.setuptools.packages.find]
include = ["app*", "pipeline*", "tests.eval*"]

# Vercel installs a wheel, not the editable source tree. These files are read
# by path at runtime (color rules load during app import), so they must ship.
[tool.setuptools.package-data]
"app.color" = ["perceptual_params.json", "rules/*.json"]
"app.recommend" = ["weights/*.json"]
"app.theory" = ["keys_params.json"]
